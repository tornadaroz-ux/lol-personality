<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1428" />
    <meta name="description" content="Care campion din League of Legends ești tu? Răspunde la 12 întrebări și află-ți match-ul perfect." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="LoL Matchmaker — Care campion ești tu?" />
    <meta property="og:description" content="Testează-ți personalitatea în League of Legends și află ce campion ți se potrivește." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/icon.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LoL Matchmaker — Care campion ești tu?" />
    <meta name="twitter:description" content="Testează-ți personalitatea în League of Legends și află ce campion ți se potrivește." />
    <meta name="twitter:image" content="assets/icon.svg" />
    <title>LoL Matchmaker — Care campion ești tu?</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg"></div>

    <header class="topbar">
      <p class="logo">LoL Matchmaker</p>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-lang="ro">RO</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <section id="screen-start" class="screen is-visible">
        <p class="kicker" data-i18n="kicker">Quiz de personalitate</p>
        <h1 data-i18n="title">Care campion din League of Legends ești tu?</h1>
        <p class="lead" data-i18n="lead">
          Răspunde la 12 întrebări. La final, îți arăt campionul care ți se potrivește.
        </p>
        <button type="button" id="btn-start" class="btn-primary" data-i18n="start">
          Începe
        </button>
      </section>

      <section id="screen-quiz" class="screen" hidden>
        <p id="quiz-progress" class="kicker"></p>
        <div class="progress" aria-hidden="true">
          <span id="quiz-progress-bar"></span>
        </div>
        <h2 id="quiz-question"></h2>
        <div id="quiz-answers" class="answers"></div>
      </section>

      <section id="screen-result" class="screen" hidden>
        <p class="kicker" data-i18n="resultKicker">Campionul tău</p>
        <div class="result-hero">
          <img id="result-image" class="result-image" alt="" />
        </div>
        <h1 id="result-name"></h1>
        <div class="result-actions">
          <button type="button" id="btn-again" class="btn-primary" data-i18n="again">
            Joacă din nou
          </button>
        </div>
        <p class="signature">Iti multumesc ca ai testat acest joc. -Joe</p>
        <div class="cute-sticker" aria-label="Cute sticker animation">
          <span>✨</span>
          <span>💛</span>
          <span>🎉</span>
        </div>
      </section>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
            .then(() => navigator.serviceWorker.register('./service-worker.js'))
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
